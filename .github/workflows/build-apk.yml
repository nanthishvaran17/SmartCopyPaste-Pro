name: Build SmartPaste Pro APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Mobile Web Assets for Capacitor
        run: |
          mkdir -p dist
          cp -r popup dist/
          cp -r options dist/
          cp -r icons dist/
          cp mobile/index.html dist/index.html
          cp mobile/manifest.json dist/manifest.json
          # Fix relative paths for dist root
          sed -i 's|\.\./popup/|popup/|g' dist/index.html || true
          sed -i 's|\.\./icons/|icons/|g' dist/manifest.json || true

      - name: Setup Capacitor and Initialize Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SmartPaste Pro" "com.smartpaste.pro" --web-dir dist
          npx cap add android
          npx cap sync android

          # Fix Kotlin stdlib-jdk7/jdk8 duplicate class collision in Gradle
          cat << 'EOF' >> android/app/build.gradle

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
EOF

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Build Output Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SmartPastePro-debug.apk

      - name: Upload SmartPaste Pro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPastePro-Android-APK
          path: build-output/SmartPastePro-debug.apk
          retention-days: 30
