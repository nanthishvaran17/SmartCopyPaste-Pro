name: Build SmartPaste Pro APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Mobile Web Assets
        run: |
          mkdir -p dist
          cp -r popup dist/
          cp -r options dist/
          cp -r icons dist/
          cp mobile/index.html dist/index.html || cp popup/popup.html dist/index.html
          cp mobile/manifest.json dist/manifest.json || cp manifest.json dist/manifest.json

      - name: Install Capacitor & Initialize Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SmartPaste Pro" "com.smartpaste.pro" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SmartPastePro-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPastePro-Android-APK
          path: build-output/SmartPastePro-debug.apk
          retention-days: 30
